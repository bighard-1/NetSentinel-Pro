[project]
name = "netsentinel-pro"
version = "0.5.0"
description = "Lightweight network operations monitoring"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "static/vendor", "data", "migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = "(^tests/|^migrations/|^static/)"
