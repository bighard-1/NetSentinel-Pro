services:
  netsentinel:
    build: .
    container_name: netsentinel
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      APP_ENV: production
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      FEISHU_WEBHOOK: ${FEISHU_WEBHOOK}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
